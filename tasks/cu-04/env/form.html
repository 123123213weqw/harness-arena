<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Multi-Step Form</title></head>
<body>
<h1>Registration</h1>
<p id="error" style="color:red"></p>

<div id="step1">
  <label>Name (6 letters): <input id="name"></label><br>
  <label>Age (18-65): <input id="age" type="number"></label><br>
  <button id="next1">Next</button>
</div>

<div id="step2" style="display:none">
  <label>Color: <select id="color"><option value="">--</option><option value="red">Red</option><option value="blue">Blue</option><option value="green">Green</option></select></label><br>
  <label>Fruit: <select id="fruit"><option value="">--</option><option value="apple">Apple</option><option value="banana">Banana</option><option value="cherry">Cherry</option></select></label><br>
  <button id="next2">Next</button>
</div>

<div id="step3" style="display:none">
  <label><input id="agree" type="checkbox"> I agree</label><br>
  <button id="submit">Submit</button>
</div>

<div id="result" style="display:none">
  <p id="final" style="font-size:1.5em"></p>
  <p id="token" style="font-family:monospace"></p>
</div>

<script>
document.getElementById('next1').onclick = function() {
  var n = document.getElementById('name').value;
  var a = parseInt(document.getElementById('age').value);
  var err = document.getElementById('error');
  if (!/^[a-zA-Z]{6}$/.test(n)) { err.textContent = 'Name must be exactly 6 letters'; return; }
  if (isNaN(a) || a < 18 || a > 65) { err.textContent = 'Age must be 18-65'; return; }
  err.textContent = '';
  document.getElementById('step1').style.display = 'none';
  document.getElementById('step2').style.display = 'block';
};
document.getElementById('next2').onclick = function() {
  var c = document.getElementById('color').value;
  var f = document.getElementById('fruit').value;
  var err = document.getElementById('error');
  if (c !== 'blue') { err.textContent = 'Please select blue'; return; }
  if (f !== 'banana') { err.textContent = 'Please select banana'; return; }
  err.textContent = '';
  document.getElementById('step2').style.display = 'none';
  document.getElementById('step3').style.display = 'block';
};
document.getElementById('submit').onclick = function() {
  if (!document.getElementById('agree').checked) {
    document.getElementById('error').textContent = 'Must agree';
    return;
  }
  document.getElementById('step3').style.display = 'none';
  document.getElementById('result').style.display = 'block';
  var seed = document.getElementById('name').value.charCodeAt(0) + parseInt(document.getElementById('age').value);
  var tok = '';
  for (var i = 0; i < 8; i++) { tok += ((seed * (i+7) + 31) % 36).toString(36)[0]; }
  document.getElementById('final').textContent = 'SUCCESS';
  document.getElementById('token').textContent = tok.toUpperCase();
};
</script>
</body>
</html>
