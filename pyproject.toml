[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-arena"
version = "0.1.0"
description = "自托管 coding-agent harness 竞技场:同题多 harness 跑分 + token/成本记账"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "rich>=13", "pytest>=8"]

[tool.setuptools.packages.find]
include = ["arena*"]
